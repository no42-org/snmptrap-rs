# snmptrapd config for integration tests.
# disableAuthorization=yes is set on the command line.
# Format keeps fields parseable: timestamp, source-IP, version, community, varbinds.
# %a = transport (L3) source IP; %A = in-PDU agent-address (v1 only).
# format2 fires for v2c and v3 (Net-SNMP has no format3). For v3, %P expands
# to "USM,SNMP v3,user <USER>,secLevel <LEVEL>" — the user name is the
# distinguishing token v3 integration tests grep for.
format1 RECV|v=1|src=%a|agent_addr=%A|community=%P|enterprise=%N|generic=%w|specific=%q|uptime=%T|trap_oid=%v\n
format2 RECV|v=2c|src=%a|community=%P|trap_oid=%v\n
authCommunity log public

# ───── SNMPv3 USM users for integration tests ─────
# `createUser -e <ENGINEID>` registers each user against the SENDER's
# authoritative engine-ID. Net-SNMP localizes keys against the originator
# for trap reception, so without `-e` snmptrapd would use its own engine-ID
# and our HMAC would fail to verify. The v3 integration tests pass
# `-E 0x80001f88040102030405` so this exact engine-ID is on the wire and
# matches the createUser entries below.
#
# Auth password "authpassword1234" and priv password "privpassword1234"
# are long enough for RFC 3414 §11.2's ≥8-char floor. They are test-only
# credentials, never reused outside this docker-bound integration lane.
createUser -e 0x80001f88040102030405 testNoAuth
createUser -e 0x80001f88040102030405 testAuth SHA-256 "authpassword1234"
createUser -e 0x80001f88040102030405 testPriv SHA-256 "authpassword1234" AES "privpassword1234"
authUser log testNoAuth noauth
authUser log testAuth auth
authUser log testPriv priv
