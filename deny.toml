[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
]
confidence-threshold = 0.93

# Anchor: every dependency must resolve to one of the licenses above.
# Compound expressions like "MIT OR Apache-2.0" are resolved by cargo-deny
# against this allowlist.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
