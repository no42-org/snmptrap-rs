version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # The rasn family (rasn, rasn-smi, rasn-snmp) moves in lock-step at the
    # same minor version; bumping one without the others produces a
    # non-buildable intermediate state.
    groups:
      rasn:
        patterns:
          - "rasn"
          - "rasn-*"
      # RustCrypto family used for SNMPv3 USM crypto. These crates
      # historically bump majors in lockstep when their shared trait
      # surface (digest, cipher) revs; grouping prevents a single-crate
      # bump from producing a non-buildable intermediate state.
      rustcrypto:
        patterns:
          - "hmac"
          - "sha1"
          - "sha2"
          - "aes"
          - "cfb-mode"
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "docker"
    directory: "/tests/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
