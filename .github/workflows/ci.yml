name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One CI run per ref; rapid pushes to a PR cancel in-progress runs to avoid
# wasted compute and Swatinem/rust-cache write-races.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        experimental: [false]
        include:
          - os: macos-latest
            experimental: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: install rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          rustc --version
          rustfmt --version
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - run: make lint
      - run: make test
      - name: integration-test compile check
        # The integration-test file is gated by `#[cfg(feature = "integration")]`
        # and does not run under default `cargo test`. Compile-check it here so
        # API drift in `socket2`/`std::net` is caught pre-merge without needing
        # Docker on the runner.
        run: cargo check --features integration --tests

  alpine-musl:
    name: alpine-musl
    runs-on: ubuntu-24.04
    container:
      # Pinned (rather than `rust:1-alpine`) so unrelated upstream image
      # refreshes can't silently shift the toolchain mid-PR. Bump together
      # with the alpine image used by tests/docker/Dockerfile.
      image: rust:1.95.0-alpine3.23
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: install build deps
        run: apk add --no-cache make musl-dev
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - run: make build
      - run: make test

  license-audit:
    name: license-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: install cargo-deny
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9  # v2.82.2
        with:
          tool: cargo-deny
      - run: make license-audit

  integration:
    # Linux+Docker lane that exercises `tests/integration_snmptrapd.rs` end-to-end:
    # the binary sends real traps to a `snmptrapd` running in a sibling
    # container, and assertions parse the receiver's log output. Includes the
    # spoofed-source tests by granting `CAP_NET_RAW` to the test + production
    # binaries before running, so `has_raw_privileges()` returns true and the
    # `--src-addr` paths actually execute (rather than skipping).
    name: integration (Linux + Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: install rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: configure docker for source-IP preservation
        # Disable docker's userland UDP proxy so packets sent to the host
        # bind preserve their L3 source IP through the bridge into the
        # container. With the proxy enabled, snmptrapd inside the container
        # sees `src=0.0.0.0` for proxied UDP and the spoofed v2c test cannot
        # observe `--src-addr`'s effect at L3. Routing via iptables NAT
        # preserves the source.
        run: |
          echo '{"userland-proxy": false}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker --version && docker compose version
      - name: build integration test binaries (no run)
        # Compile up-front so the next step can `setcap` the resulting
        # binaries. `make integration-test` below then exec's them as a
        # cache hit — no rebuild, caps preserved through exec.
        run: cargo test --workspace --all-targets --features integration --no-run
      - name: grant CAP_NET_RAW to test + production binaries
        # `has_raw_privileges()` opens a raw socket from the test process to
        # decide whether to skip the spoofed tests. Without caps it returns
        # false and 2/5 tests skip. With caps the test exec's `target/debug/snmptrap-rs`
        # which itself needs caps to actually emit the spoofed packet.
        run: |
          INTEG_BIN=$(ls -t target/debug/deps/integration_snmptrapd-* 2>/dev/null | grep -v '\.d$' | head -1)
          test -n "$INTEG_BIN" -a -x "$INTEG_BIN" || { echo "could not find integration test binary" >&2; exit 1; }
          sudo setcap cap_net_raw+ep "$INTEG_BIN"
          sudo setcap cap_net_raw+ep target/debug/snmptrap-rs
      - name: configure unreachable route for routing-failure test
        # `routing_failure_does_not_blame_capabilities_linux` (archived task 9.6)
        # needs the kernel sendto to return ENETUNREACH/EHOSTUNREACH so the
        # test can observe the routing-vs-capability classification. Default
        # routes would otherwise happily forward to TEST-NET-1 and the test
        # would skip cleanly. Pinning the unreachable route makes the assertion
        # actually fire on every CI run.
        run: sudo ip route add unreachable 192.0.2.0/24
      - name: integration-test
        run: make integration-test

  cargo-deny-probationary:
    # Decision 2 (resolved (c)): broaden cargo-deny to advisories + bans + sources
    # on a non-blocking probationary lane. Promote to a required gate (and fold
    # into `make license-audit`) once it's been clean for a release cycle.
    name: cargo-deny-probationary (advisories+bans+sources)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: install cargo-deny
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9  # v2.82.2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans sources
