name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One CI run per ref; rapid pushes to a PR cancel in-progress runs to avoid
# wasted compute and Swatinem/rust-cache write-races.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        experimental: [false]
        include:
          - os: macos-latest
            experimental: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: install rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          rustc --version
          rustfmt --version
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
      - run: make lint
      - run: make test
      - name: integration-test compile check
        # The integration-test file is gated by `#[cfg(feature = "integration")]`
        # and does not run under default `cargo test`. Compile-check it here so
        # API drift in `socket2`/`std::net` is caught pre-merge without needing
        # Docker on the runner.
        run: cargo check --features integration --tests

  alpine-musl:
    name: alpine-musl
    runs-on: ubuntu-24.04
    container:
      # Pinned (rather than `rust:1-alpine`) so unrelated upstream image
      # refreshes can't silently shift the toolchain mid-PR. Bump together
      # with the alpine image used by tests/docker/Dockerfile.
      image: rust:1.95.0-alpine3.21
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: install build deps
        run: apk add --no-cache make musl-dev
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
      - run: make build
      - run: make test

  license-audit:
    name: license-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: install cargo-deny
        uses: taiki-e/install-action@711e1c3275189d76dcc4d34ddea63bf96ac49090  # v2.76.0
        with:
          tool: cargo-deny
      - run: make license-audit

  cargo-deny-probationary:
    # Decision 2 (resolved (c)): broaden cargo-deny to advisories + bans + sources
    # on a non-blocking probationary lane. Promote to a required gate (and fold
    # into `make license-audit`) once it's been clean for a release cycle.
    name: cargo-deny-probationary (advisories+bans+sources)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: install cargo-deny
        uses: taiki-e/install-action@711e1c3275189d76dcc4d34ddea63bf96ac49090  # v2.76.0
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans sources
